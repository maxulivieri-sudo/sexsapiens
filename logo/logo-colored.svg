<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="512" height="512" fill="none">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Gradients -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  
  <!-- Dark Background matching the site theme -->
  <rect width="100%" height="100%" fill="#0a0814" rx="28" />
  
  <g transform="translate(0, -10)">
    <!-- Outer Glow Silhouette -->
    <path d="M 250 375 
             C 215 375, 120 315, 120 210 
             C 120 145, 175 125, 225 160 
             C 238 170, 244 178, 250 185 
             C 256 178, 262 170, 275 160 
             C 325 125, 380 145, 380 210 
             C 380 315, 285 375, 250 375 Z" 
          fill="none" 
          stroke="#ec4899" 
          stroke-width="24" 
          opacity="0.4" 
          filter="url(#glow-magenta)" />
          
    <path d="M 250 375 
             C 215 375, 120 315, 120 210 
             C 120 145, 175 125, 225 160 
             C 238 170, 244 178, 250 185 
             C 256 178, 262 170, 275 160 
             C 325 125, 380 145, 380 210 
             C 380 315, 285 375, 250 375 Z" 
          fill="none" 
          stroke="#8b5cf6" 
          stroke-width="14" 
          opacity="0.6" />

    <!-- Main Heart Brain Body -->
    <path d="M 250 375 
             C 215 375, 120 315, 120 210 
             C 120 145, 175 125, 225 160 
             C 238 170, 244 178, 250 185 
             C 256 178, 262 170, 275 160 
             C 325 125, 380 145, 380 210 
             C 380 315, 285 375, 250 375 Z" 
          fill="url(#brainGrad)" 
          stroke="url(#strokeGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Brain Folds (Interior details) -->
    <!-- Left Lobe Folds -->
    <path d="M 170 190 Q 145 200 155 225 T 195 230" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 180 160 Q 145 165 165 190" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 215 170 Q 190 195 210 220" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 195 275 Q 155 285 175 315" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />

    <!-- Right Lobe Folds -->
    <path d="M 330 190 Q 355 200 345 225 T 305 230" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 320 160 Q 355 165 335 190" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 285 170 Q 310 195 290 220" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />
    <path d="M 305 275 Q 345 285 325 315" fill="none" stroke="#fdf4ff" stroke-width="4" opacity="0.35" stroke-linecap="round" />

    <!-- Center Division -->
    <path d="M 250 192 L 250 225 M 250 335 L 250 365" stroke="#fdf4ff" stroke-width="4" stroke-dasharray="3 5" opacity="0.4" stroke-linecap="round" />

    <!-- Blush Cheeks -->
    <ellipse cx="185" cy="285" rx="14" ry="8" fill="#f472b6" opacity="0.7" filter="url(#glow-magenta)" />
    <ellipse cx="315" cy="285" rx="14" ry="8" fill="#f472b6" opacity="0.7" filter="url(#glow-magenta)" />

    <!-- Eyes -->
    <circle cx="200" cy="250" r="22" fill="#0d081c" />
    <circle cx="206" cy="244" r="7.5" fill="#ffffff" />
    <circle cx="192" cy="256" r="3.5" fill="#ffffff" />
    
    <circle cx="300" cy="250" r="22" fill="#0d081c" />
    <circle cx="294" cy="244" r="7.5" fill="#ffffff" />
    <circle cx="308" cy="256" r="3.5" fill="#ffffff" />

    <!-- Glasses Frame (Neon Blue/Cyan) -->
    <circle cx="200" cy="250" r="32" fill="none" stroke="#0d081c" stroke-width="8" />
    <circle cx="200" cy="250" r="32" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow-cyan)" />
    
    <circle cx="300" cy="250" r="32" fill="none" stroke="#0d081c" stroke-width="8" />
    <circle cx="300" cy="250" r="32" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow-cyan)" />
    
    <!-- Bridge -->
    <path d="M 232 250 Q 250 245 268 250" fill="none" stroke="#0d081c" stroke-width="8" stroke-linecap="round" />
    <path d="M 232 250 Q 250 245 268 250" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />

    <!-- Glasses Temples (Stanghette) -->
    <path d="M 168 250 H 135" fill="none" stroke="#0d081c" stroke-width="7" stroke-linecap="round" />
    <path d="M 332 250 H 365" fill="none" stroke="#0d081c" stroke-width="7" stroke-linecap="round" />

    <!-- Cute Smile -->
    <path d="M 236 296 Q 250 310 264 296" fill="none" stroke="#0d081c" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Title Text "Sexsapiens" with neon glow -->
  <text x="250" y="445" 
        font-family="'Outfit', 'Inter', sans-serif" 
        font-size="44" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1.5"
        filter="url(#glow-magenta)"
        style="text-shadow: 0 0 10px rgba(236, 72, 153, 0.6), 0 0 20px rgba(139, 92, 246, 0.4);">Sexsapiens</text>
</svg>
