<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="512" height="512" fill="none" stroke="#ffffff">
  <g transform="translate(0, -10)">
    <!-- Main Heart Brain Outline -->
    <path d="M 250 375 
             C 215 375, 120 315, 120 210 
             C 120 145, 175 125, 225 160 
             C 238 170, 244 178, 250 185 
             C 256 178, 262 170, 275 160 
             C 325 125, 380 145, 380 210 
             C 380 315, 285 375, 250 375 Z" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Brain Folds -->
    <!-- Left Lobe Folds -->
    <path d="M 170 190 Q 145 200 155 225 T 195 230" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 180 160 Q 145 165 165 190" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 215 170 Q 190 195 210 220" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 195 275 Q 155 285 175 315" stroke-width="4" opacity="0.6" stroke-linecap="round" />

    <!-- Right Lobe Folds -->
    <path d="M 330 190 Q 355 200 345 225 T 305 230" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 320 160 Q 355 165 335 190" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 285 170 Q 310 195 290 220" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <path d="M 305 275 Q 345 285 325 315" stroke-width="4" opacity="0.6" stroke-linecap="round" />

    <!-- Center Division -->
    <path d="M 250 192 L 250 225 M 250 335 L 250 365" stroke-width="4" stroke-dasharray="3 5" opacity="0.6" stroke-linecap="round" />

    <!-- Blush Cheeks (Subtle fill) -->
    <ellipse cx="185" cy="285" rx="14" ry="8" fill="#ffffff" stroke="none" opacity="0.2" />
    <ellipse cx="315" cy="285" rx="14" ry="8" fill="#ffffff" stroke="none" opacity="0.2" />

    <!-- Eyes (Outline style with small pupils) -->
    <circle cx="200" cy="250" r="16" stroke-width="4" />
    <circle cx="200" cy="250" r="6" fill="#ffffff" stroke="none" />
    
    <circle cx="300" cy="250" r="16" stroke-width="4" />
    <circle cx="300" cy="250" r="6" fill="#ffffff" stroke="none" />

    <!-- Glasses Frame -->
    <circle cx="200" cy="250" r="32" stroke-width="6" />
    <circle cx="300" cy="250" r="32" stroke-width="6" />
    
    <!-- Bridge -->
    <path d="M 232 250 Q 250 245 268 250" stroke-width="6" stroke-linecap="round" />

    <!-- Glasses Temples -->
    <path d="M 168 250 H 135" stroke-width="6" stroke-linecap="round" />
    <path d="M 332 250 H 365" stroke-width="6" stroke-linecap="round" />

    <!-- Cute Smile -->
    <path d="M 236 296 Q 250 310 264 296" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Title Text "Sexsapiens" -->
  <text x="250" y="445" 
        font-family="'Outfit', 'Inter', sans-serif" 
        font-size="44" 
        font-weight="800" 
        fill="#ffffff" 
        stroke="none"
        text-anchor="middle" 
        letter-spacing="1.5">Sexsapiens</text>
</svg>
